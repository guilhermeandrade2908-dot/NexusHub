<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusHub</title>
    
    <!-- FONTE VIA GOOGLE FONTS: -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@500;700;800;900&display=swap" rel="stylesheet">

    <!-- ÍCONES MODERNOS VIA PHOSPHOR ICONS -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

     <!-- LINKS DOS ARQUIVOS CSS -->
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/sidebar.css">
    <link rel="stylesheet" href="assets/css/cards.css">
    <link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body>
    <div class="system-container">

        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="brand-logo">
                    <i class="ph-bold ph-cpu"></i>
                    <span>NEXUS</span><span>HUB</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <ul>
                    <li class="active">
                        <a href="#dashboard" data-view="dashboard">
                            <i class="ph-bold ph-squares-four"></i>
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li>
                        <a href="#estudos" data-view="estudos">
                            <i class="ph-bold ph-book-open"></i>
                            <span>Estudos</span>
                        </a>
                    </li>
                    <li>
                        <a href="#projetos" data-view="projetos">
                            <i class="ph-bold ph-code"></i>
                            <span>Projetos</span>
                        </a>
                    </li>
                    <li>
                        <a href="#lazer" data-view="lazer">
                            <i class="ph-bold ph-game-controller"></i>
                            <span>Lazer & Midia</span>
                        </a>
                    </li>
                    <li>
                        <a href="#perfil" data-view="perfil">
                            <i class="ph-bold ph-user-gear"></i>
                            <span>Perfil</span>
                        </a>
                    </li>
                </ul>
            </nav>

            <div class="sidebar-footer">
                <div class="user-status-card">
                    <div class="status-indicator online"></div>
                    <div class="user-info">
                        <span class="user-name" id="user-display-name">Dev</span>
                        <span class="user-role">System Operator</span>
                    </div>
                </div>
            </div>
        </aside>
    
        <main class="main-content">
            <header class="top-bar">
                <div class="welcome-text">
                    <h1 class="title">Visão Geral do Sistema</h1>
                    <p class="subtitle">Bem-vindo. Todos os subsistemas operacionais.</p>
                </div>
                <div class="top-bar-actions">
                    <div class="system-time" id="clock-display">00:00:00</div>
                </div>
            </header>

            <!-- DASHBOARD (PADRÃO) -->
            <section id="view-dashboard" class="view-section active">
                <div class="grid-section stats-row">
                    <div class="card stat-card" id="stat-estudos">
                        <div class="card-icon"><i class="ph-bold ph-clock"></i></div>
                        <div class="card-data">
                            <span class="stat-value">-- h</span>
                            <span class="stat-label">Horas Estudadas</span>
                        </div>
                    </div>
                    <div class="card stat-card" id="stat-projetos">
                        <div class="card-icon"><i class="ph-bold ph-git-branch"></i></div>
                        <div class="card-data">
                            <span class="stat-value">--</span>
                            <span class="stat-label">Projetos Ativos</span>
                        </div>
                    </div>
                    <div class="card stat-card" id="stat-metas">
                        <div class="card-icon"><i class="ph-bold ph-trophy"></i></div>
                        <div class="card-data">
                            <span class="stat-value">--%</span>
                            <span class="stat-label">Metas Concluídas</span>
                        </div>
                    </div>
                    <div class="card stat-card" id="stat-status">
                        <div class="card-icon"><i class="ph-bold ph-pulse"></i></div>
                        <div class="card-data">
                            <span class="stat-value text-success">Online</span>
                            <span class="stat-label">Status do Sistema</span>
                        </div>
                    </div>
                </div>

                <div class="grid-section main-row">
                    <div id="foco-container"></div>
                    <div id="metas-container"></div>
                </div>
            </section>

            <!-- ESTUDOS -->
            <section id="view-estudos" class="view-section">
                <div id="estudos-container"></div>
            </section>

            <!-- PROJETOS -->
            <section id="view-projetos" class="view-section">
                <div id="projetos-container"></div>
            </section>

            <!-- LAZER -->
            <section id="view-lazer" class="view-section">
                <div id="lazer-container"></div>
            </section>

            <!-- PERFIL -->
            <section id="view-perfil" class="view-section">
                <div id="perfil-container"></div>
            </section>
        </main>
</div>

    <!-- SCRIPTS MODULARIZADOS -->
    <script type="module" src="assets/javascript/app.js"></script>
</body>
</html>
